<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Brevet Histoire Booster - Mode Compétition Animé</title>
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --neon-violet: #bc34fa;
            --neon-violet-glow: rgba(188, 52, 250, 0.4);
            --neon-blue: #00d2ff;
            --success-neon: #00ffa3;
            --error-neon: #ff0055;
            --card-bg: rgba(20, 20, 25, 0.85);
            --text-light: #f1f2f6;
            --hint-bg: linear-gradient(135deg, #25103a 0%, #150525 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600' viewBox='0 0 100 100' opacity='0.04'><circle cx='50' cy='50' r='48' fill='none' stroke='%23bc34fa' stroke-width='1'/><line x1='50' y1='50' x2='50' y2='15' stroke='%23bc34fa' stroke-width='1.5'/><line x1='50' y1='50' x2='75' y2='50' stroke='%23bc34fa' stroke-width='1.2'/><circle cx='50' cy='50' r='2' fill='%23bc34fa'/></svg>");
            background-position: center 150px;
            background-repeat: no-repeat;
            background-size: 550px;
            color: var(--text-light);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #1a0826 0%, #0a0212 100%);
            border: 2px solid var(--neon-violet);
            box-shadow: 0 0 15px var(--neon-violet-glow);
            color: white;
            padding: 25px 40px;
            border-radius: 20px;
            max-width: 650px;
            width: 100%;
            position: relative;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            text-shadow: 0 0 10px var(--neon-violet);
            letter-spacing: 1px;
        }

        header p {
            font-size: 0.95rem;
            color: #a29bfe;
        }

        .score-board {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(188, 52, 250, 0.2);
            border: 1px solid var(--neon-violet);
            padding: 5px 15px;
            border-radius: 10px;
            font-weight: bold;
            color: var(--success-neon);
            text-shadow: 0 0 5px var(--success-neon);
            transition: all 0.3s ease;
        }

        .score-pop {
            transform: scale(1.2);
            text-shadow: 0 0 15px var(--success-neon);
        }

        .nav-modes {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            background: #11091c;
            padding: 6px;
            border-radius: 30px;
            border: 1px solid rgba(188, 52, 250, 0.2);
        }

        .btn-mode {
            padding: 10px 24px;
            border: none;
            background: transparent;
            color: #8e8d9a;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-mode.active {
            background: var(--neon-violet);
            color: white;
            box-shadow: 0 0 15px var(--neon-violet);
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 2px solid rgba(188, 52, 250, 0.3);
        }

        /* --- Barre de Timer --- */
        .timer-container {
            width: 100%;
            height: 6px;
            background: #1e1e24;
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
            display: none;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--neon-violet), var(--neon-blue));
            box-shadow: 0 0 8px var(--neon-blue);
            transition: width 0.1s linear;
        }

        /* --- Mode Flashcard --- */
        .flashcard-zone {
            perspective: 1000px;
            height: 220px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 18px;
            padding: 25px;
            text-align: center;
        }

        .card-front {
            background: #14141a;
            color: var(--text-light);
            border: 2px solid var(--neon-blue);
            box-shadow: inset 0 0 15px rgba(0, 210, 255, 0.1);
        }

        .card-front h2 {
            font-size: 2.8rem;
            color: #00d2ff;
            text-shadow: 0 0 12px rgba(0, 210, 255, 0.6);
            font-weight: 800;
        }

        .card-back {
            background: linear-gradient(135deg, #2b0b47 0%, #140424 100%);
            color: white;
            transform: rotateY(180deg);
            border: 2px solid var(--neon-violet);
            box-shadow: inset 0 0 20px var(--neon-violet-glow);
        }

        .card-back p {
            font-size: 1.4rem;
            font-weight: 600;
            line-height: 1.4;
        }

        /* --- Mode QCM --- */
        .qcm-question {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 25px;
            text-align: center;
            color: #dfe4ea;
            line-height: 1.4;
        }

        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .option-wrapper {
            position: relative;
            width: 100%;
        }

        .option {
            width: 100%;
            padding: 14px 20px;
            border: 2px solid #2f2f3d;
            background: #191923;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            font-weight: 500;
            color: #cbd5e1;
            text-align: left;
        }

        .option:hover:not(.disabled) {
            background-color: #222230;
            border-color: var(--neon-violet);
            box-shadow: 0 0 10px rgba(188, 52, 250, 0.3);
            transform: translateY(-2px);
        }

        /* --- ANIMATIONS DE RÉPONSES --- */
        .option.correct {
            background: #00261a;
            border-color: var(--success-neon);
            color: #00ffcb;
            font-weight: 700;
            box-shadow: 0 0 25px rgba(0, 255, 163, 0.8);
            animation: successSpin 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .option.incorrect {
            background: #2d0010;
            border-color: var(--error-neon);
            color: #ff4d79;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.8);
            animation: errorShrink 0.3s ease-in-out forwards;
        }

        .option.disabled {
            cursor: not-allowed;
            opacity: 0.3;
        }
        .option.disabled.correct, .option.disabled.incorrect { 
            opacity: 1; 
        }

        /* Animation de texte flottant +1 / +2 */
        .score-float {
            position: absolute;
            right: 20px;
            top: -15px;
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--success-neon);
            text-shadow: 0 0 8px var(--success-neon);
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 10;
        }

        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(10px) scale(0.8); }
            20% { opacity: 1; transform: translateY(0) scale(1.2); }
            100% { opacity: 0; transform: translateY(-25px) scale(1); }
        }

        @keyframes successSpin {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        @keyframes errorShrink {
            0% { transform: scale(1); }
            30% { transform: scale(0.92); }
            70% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* --- Indices Fluos --- */
        .hint-box {
            background: var(--hint-bg);
            border: 1px solid #e67e22;
            border-left: 5px solid #ff9f43;
            color: #ffcc80;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            font-size: 0.95rem;
            font-weight: 500;
            display: none;
            box-shadow: 0 0 15px rgba(230, 126, 34, 0.25);
            animation: popIn 0.3s ease;
        }

        /* --- Navigation / Outils --- */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            gap: 15px;
        }

        .btn {
            padding: 12px 22px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-hint {
            background-color: #241435;
            color: #dca3ff;
            border: 2px solid var(--neon-violet);
        }

        .btn-hint:hover:not(:disabled) {
            background-color: #331d4b;
            box-shadow: 0 0 12px var(--neon-violet);
            transform: scale(1.03);
        }

        .btn-hint:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-next {
            background: linear-gradient(135deg, #bc34fa 0%, #761bf0 100%);
            color: white;
            box-shadow: 0 0 15px var(--neon-violet-glow);
        }

        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px var(--neon-violet);
        }

        .progress {
            font-size: 0.95rem;
            color: #a29bfe;
            font-weight: 700;
            background: #1b122c;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(162, 155, 254, 0.3);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Brevet Histoire Booster</h1>
        <p>Maîtrise la chronologie du programme de 3ème</p>
        <div class="score-board" id="score-display">Score: 0 pts</div>
    </header>

    <div class="nav-modes">
        <button class="btn-mode active" onclick="setMode('flashcards')">🃏 Flashcards</button>
        <button class="btn-mode" onclick="setMode('qcm')">📝 Mode QCM</button>
    </div>

    <div class="container">
        <div class="timer-container" id="timer-zone">
            <div class="timer-bar" id="timer-progress"></div>
        </div>

        <div id="flashcard-view">
            <div class="flashcard-zone" onclick="flipCard()">
                <div class="flashcard" id="card">
                    <div class="card-face card-front">
                        <h2 id="fc-date">Date</h2>
                        <span style="font-size: 0.85rem; color:#00d2ff; margin-top:25px; font-weight:500; background:rgba(0,210,255,0.1); padding:4px 12px; border-radius:10px;">👉 Clique pour retourner</span>
                    </div>
                    <div class="card-face card-back">
                        <p id="fc-event">Événement</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="qcm-view" style="display: none;">
            <div class="qcm-question" id="qcm-question-date">Quelle est l'explication de cette date ?</div>
            <ul class="options-list" id="qcm-options">
                </ul>
        </div>

        <div>
            <div class="hint-box" id="hint-display"></div>
            
            <div class="controls">
                <button class="btn btn-hint" id="hint-btn" onclick="toggleHint()">💡 Un indice ?</button>
                <div class="progress" id="progress-text">0 / 0</div>
                <button class="btn btn-next" id="next-btn" onclick="nextItem()">Suivant ➔</button>
            </div>
        </div>
    </div>

    <script>
        const data = [
            { date: "1914-1918", event: "Grande Guerre (Première guerre mondiale)", hint: "Pense au conflit mondial majeur caractérisé par la longue vie terrible des soldats dans les tranchées boueuses." },
            { date: "1916", event: "Verdun", hint: "La bataille la plus longue et meurtrière en France lors du premier conflit mondial. Emblème des 'Poilus'." },
            { date: "1917", event: "Révolution(s) russe(s)", hint: "Lénine et les Bolcheviks provoquent la chute définitive du régime impérial du Tsar." },
            { date: "11 novembre 1918", event: "Armistice de la Première Guerre mondiale", hint: "Un cessez-le-feu historique signé à la 11ème heure du 11ème jour du 11ème mois dans la forêt de Compiègne." },
            { date: "1924-1953", event: "Staline au pouvoir en URSS", hint: "Longue dictature caractérisée par un régime totalitaire soviétique, le culte de la personnalité et les goulags." },
            { date: "1933-1945", event: "L’Allemagne nazie d’Adolf Hitler", hint: "L'arrivée au pouvoir de l'idéologie du IIIe Reich, menant l'Europe vers le totalitarisme et la haine antisémite." },
            { date: "1936", event: "Victoire électorale du Front populaire et Lois sociales", hint: "C'est l'année joyeuse des premiers congés payés de l'histoire des ouvriers français et de la semaine des 40 heures." },
            { date: "1939-1945", event: "Seconde Guerre mondiale", hint: "Le plus vaste conflit de l'histoire humaine, marqué par une guerre d'anéantissement idéologique totale." },
            { date: "18 juin 1940", event: "Appel du général De Gaulle à la radio de Londres", hint: "Un discours radiophonique fondateur exhortant les Français à refuser la défaite et à résister." },
            { date: "1940-1944", event: "Régime de Vichy", hint: "Gouvernement anti-républicain dirigé par le Maréchal Pétain qui fait le choix de collaborer avec l'occupant nazi." },
            { date: "6 juin 1944", event: "Débarquement allié en Normandie", hint: "L'opération 'Overlord' : des milliers de soldats américains, britanniques et canadiens arrivent sur les plages françaises." },
            { date: "1944-1945", event: "Libération de la France, GPRF et rétablissement de la République ; ( la IV eme République)", hint: "La fin de l'occupation nazie amène un gouvernement provisoire à reconstruire les lois démocratiques brisées." },
            { date: "1944-1945", event: "Droit de vote des femmes en France", hint: "Une conquête d'égalité citoyenne majeure décidée à la Libération. Elles votent pour la première fois aux municipales de 1945." },
            { date: "8 mai 1945", event: "Capitulation allemande - fin de la Seconde Guerre mondiale en Europe", hint: "La capitulation sans condition des armées d'Hitler est signée à Berlin. Les combats s'arrêtent sur le continent." },
            { date: "Août 1945", event: "Bombes atomiques sur Hiroshima et Nagasaki (Japon)", hint: "L'entrée du monde dans l'ère nucléaire suite à deux frappes américaines destructrices poussant l'empereur nippon à céder." },
            { date: "1945", event: "Création de l’ONU", hint: "Naissance de l'Organisation des Nations Unies lors de la conférence de San Francisco pour remplacer la SDN défaillante." },
            { date: "1947-1991", event: "Guerre Froide", hint: "Un monde bipolaire figé dans un affrontement idéologique permanent sans guerre directe entre les USA et l'URSS." },
            { date: "1947-1962", event: "Principale phase de décolonisation", hint: "Le grand mouvement d'émancipation où les empires coloniaux s'effondrent pour donner naissance aux nouveaux États indépendants." },
            { date: "1954-1962", event: "Guerre d’Algérie", hint: "Une guerre d'indépendance coloniale traumatisante qui provoquera de lourdes crises politiques en métropole." },
            { date: "1957", event: "Traité de Rome, création de l’UE", hint: "Signature historique mettant en place la CEE (Communauté Économique Européenne) entre 6 pays fondateurs." },
            { date: "1958", event: "Naissance de la Ve République", hint: "Adoption de notre Constitution actuelle, accordant un rôle exécutif fort au Président de la République." },
            { date: "1958-1969", event: "Les années de GAULLE", hint: "La période durant laquelle le chef de la France Libre dirige le pays en tant que Président élu." },
            { date: "1962", event: "Indépendance de l’Algérie", hint: "Année officielle de la naissance du nouvel État algérien souverain après la signature des accords d'Évian." },
            { date: "1962", event: "Election du président de la République au suffrage universel direct", hint: "Grâce à un référendum voulu par De Gaulle, c'est désormais chaque citoyen qui vote directement pour le Président." },
            { date: "1975", event: "Loi Veil sur l’Interruption Volontaire de Grossesse (IVG)", hint: "Un grand texte de société dépénalisant l'avortement, courageusement porté par Simone Veil devant l'Assemblée nationale." },
            { date: "1981-1995", event: "Les années MITTERRAND et alternance", hint: "Cette période marque l'arrivée historique d'un président de gauche au pouvoir sous les institutions de la Ve République." },
            { date: "9 novembre 1989", event: "Chute du mur de Berlin", hint: "La 'nuit de la liberté' où les Allemands détruisent le 'rideau de fer' séparant la ville en deux depuis des décennies." },
            { date: "1991", event: "Eclatement : dislocation de l’URSS", hint: "L'effondrement définitif du bloc soviétique et la démission de Mikhaïl Gorbatchev marquent la fin de la superpuissance communiste." },
            { date: "1992", event: "Traite de Maastricht", hint: "Ce traité européen capital donne naissance à la citoyenneté européenne et jette les bases de l'unification monétaire." },
            { date: "1995-2007", event: "Les années CHIRAC", hint: "La période de présidence marquée notamment par la dissolution de l'Assemblée en 1997 et le passage du mandat de 7 à 5 ans." },
            { date: "11 septembre 2001", event: "Attentats terroristes aux Etats-Unis", hint: "Quatre avions de ligne détournés par l'organisation terroriste Al-Qaïda s'écrasent, visant le cœur économique et militaire américain." },
            { date: "2002", event: "Euro monnaie européenne", hint: "L'année où tes parents ont troqué les pièces en Francs de leur porte-monnaie contre de nouveaux billets communs européens." }
        ];

        let currentMode = 'flashcards';
        let currentIndex = 0;
        let shuffledData = [];
        let score = 0;
        let hintUsedInCurrentQuestion = false;
        let timerInterval = null;
        let timeLeft = 30;
        let qcmAnswered = false;

        function initApp() {
            shuffledData = [...data].sort(() => Math.random() - 0.5);
            currentIndex = 0;
            score = 0;
            document.getElementById('score-display').innerText = `Score: ${score} pts`;
            updateView();
        }

        function setMode(mode) {
            currentMode = mode;
            clearInterval(timerInterval);
            document.querySelectorAll('.btn-mode').forEach(btn => btn.classList.remove('active'));
            
            if(mode === 'flashcards') {
                document.querySelector('.btn-mode:nth-child(1)').classList.add('active');
                document.getElementById('flashcard-view').style.display = 'block';
                document.getElementById('qcm-view').style.display = 'none';
                document.getElementById('timer-zone').style.display = 'none';
                document.getElementById('hint-btn').disabled = false;
            } else {
                document.querySelector('.btn-mode:nth-child(2)').classList.add('active');
                document.getElementById('flashcard-view').style.display = 'none';
                document.getElementById('qcm-view').style.display = 'block';
                document.getElementById('timer-zone').style.display = 'block';
            }
            updateView();
        }

        function flipCard() {
            document.getElementById('card').classList.toggle('flipped');
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-display');
            if (hintBox.style.display === 'block') {
                hintBox.style.display = 'none';
            } else {
                hintBox.innerHTML = `💡 <b>Indice temporel :</b><br>${shuffledData[currentIndex].hint}`;
                hintBox.style.display = 'block';
                hintUsedInCurrentQuestion = true;
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 30;
            qcmAnswered = false;
            document.getElementById('timer-progress').style.width = '100%';
            
            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                let percentage = (timeLeft / 30) * 100;
                document.getElementById('timer-progress').style.width = `${percentage}%`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timeoutAnswer();
                }
            }, 100);
        }

        function updateView() {
            document.getElementById('hint-display').style.display = 'none';
            document.getElementById('progress-text').innerText = `${currentIndex + 1} / ${shuffledData.length}`;
            hintUsedInCurrentQuestion = false;
            
            const currentItem = shuffledData[currentIndex];

            if (currentMode === 'flashcards') {
                const card = document.getElementById('card');
                card.style.transition = 'none';
                card.classList.remove('flipped');
                setTimeout(() => card.style.transition = 'transform 0.6s cubic-bezier(0.4, 0, 0.2, 1)', 50);

                document.getElementById('fc-date').innerText = currentItem.date;
                document.getElementById('fc-event').innerText = currentItem.event;
            } else {
                document.getElementById('hint-btn').disabled = false;
                document.getElementById('qcm-question-date').innerText = `Que s'est-il passé pendant la période / date suivante : [ ${currentItem.date} ] ?`;
                
                let distractors = data
                    .filter(item => item.event !== currentItem.event)
                    .map(item => item.event);
                
                distractors = [...new Set(distractors)].sort(() => Math.random() - 0.5).slice(0, 3);
                let options = [currentItem.event, ...distractors].sort(() => Math.random() - 0.5);
                
                const optionsList = document.getElementById('qcm-options');
                optionsList.innerHTML = '';
                
                options.forEach(opt => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'option-wrapper';

                    const li = document.createElement('button');
                    li.className = 'option';
                    li.innerText = opt;
                    li.onclick = () => checkAnswer(wrapper, li, opt, currentItem.event);
                    
                    wrapper.appendChild(li);
                    optionsList.appendChild(wrapper);
                });
                startTimer();
            }
        }

        function checkAnswer(wrapper, element, selected, correct) {
            if (qcmAnswered) return;
            qcmAnswered = true;
            clearInterval(timerInterval);
            document.getElementById('hint-btn').disabled = true;

            const options = document.querySelectorAll('.option');
            options.forEach(opt => {
                opt.classList.add('disabled');
                if (opt.innerText === correct) {
                    opt.classList.add('correct');
                }
            });

            if (selected === correct) {
                let pointsGagnes = hintUsedInCurrentQuestion ? 1 : 2;
                score += pointsGagnes;
                
                // Mise à jour graphique du score global
                const scoreDisplay = document.getElementById('score-display');
                scoreDisplay.innerText = `Score: ${score} pts`;
                scoreDisplay.classList.add('score-pop');
                setTimeout(() => scoreDisplay.classList.remove('score-pop'), 300);

                // Lancement du texte flottant animé (+1 ou +2)
                const floatText = document.createElement('span');
                floatText.className = 'score-float';
                floatText.innerText = `+${pointsGagnes}`;
                wrapper.appendChild(floatText);
                setTimeout(() => floatText.remove(), 800);
            } else {
                element.classList.add('incorrect');
            }
        }

        function timeoutAnswer() {
            if (qcmAnswered) return;
            qcmAnswered = true;
            document.getElementById('hint-btn').disabled = true;
            
            const currentItem = shuffledData[currentIndex];
            const options = document.querySelectorAll('.option');
            
            options.forEach(opt => {
                opt.classList.add('disabled');
                if (opt.innerText === currentItem.event) {
                    opt.classList.add('correct');
                }
            });
            
            document.getElementById('qcm-question-date').innerText = `⏰ Temps écoulé ! La réponse était :`;
        }

        function nextItem() {
            currentIndex = (currentIndex + 1) % shuffledData.length;
            updateView();
        }

        window.onload = initApp;
    </script>
</body>
</html>
